<!-- Verrou horizontal : symbole + nom. Le texte est un <text> en Outfit (la
     police de l'app) : pour un usage hors navigateur - imprimeur, enseigne -
     vectoriser le texte avant envoi, sinon la substitution de police est
     silencieuse. Version sur fond sombre : remplacer #14162e par #ffffff et
     #5b6178 par #9cb9ff. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Daba Syndic">
  <defs>
    <linearGradient id="dsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#465fff"/>
      <stop offset="1" stop-color="#2a31d8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#dsGrad)"/>
  <g transform="translate(-1,0)">
    <path d="M22 48V16h6.5c9.7 0 15.5 6.2 15.5 16S38.2 48 28.5 48H22z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <rect x="27.4" y="27" width="4.2" height="4.2" rx="1.1" fill="#fff"/>
    <rect x="33.6" y="27" width="4.2" height="4.2" rx="1.1" fill="#fff"/>
    <rect x="27.4" y="33.8" width="4.2" height="4.2" rx="1.1" fill="#fff"/>
    <rect x="33.6" y="33.8" width="4.2" height="4.2" rx="1.1" fill="#fdb022"/>
  </g>
  <text x="80" y="41" font-family="Outfit, 'Helvetica Neue', Arial, sans-serif" font-size="26" letter-spacing="-0.6">
    <tspan fill="#14162e" font-weight="700">Daba</tspan><tspan fill="#5b6178" font-weight="400" dx="7">Syndic</tspan>
  </text>
</svg>
