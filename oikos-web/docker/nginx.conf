server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers d'association des applications mobiles (liens universels iOS et
    # App Links Android). Deux exigences qui ne pardonnent pas :
    #
    #  - le type MIME doit être application/json ; le fichier Apple n'a pas
    #    d'extension, nginx le servirait donc en application/octet-stream et iOS
    #    ignorerait silencieusement l'association ;
    #  - un fichier manquant doit répondre 404, pas index.html. Le repli SPA
    #    ci-dessous renverrait une page HTML avec un code 200, qu'Apple et Google
    #    interprètent comme une association valide mais illisible - une panne
    #    bien plus difficile à lire qu'un franc 404.
    location /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    location /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # React Router client-side routing: any path not matching a static
    # asset falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
