name: Deploy recette

# Build + test + build&push images (runners GitHub, RAM confortable) puis
# déploiement sur le VPS de recette (4 Go de RAM : jamais de build sur
# place, il ne fait que docker compose pull/up). Voir
# docker-compose.staging.yml et README.md, section "Docker / recette".
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/oikos-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/oikos-web

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: oikos-api/pom.xml
      - working-directory: oikos-api
        run: ./mvnw -B test

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: oikos-web/package-lock.json
      - working-directory: oikos-web
        run: npm ci
      - working-directory: oikos-web
        run: npm run test
      - working-directory: oikos-web
        run: npm run build

  build-push:
    needs: [test-api, test-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./oikos-api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:recette
            ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=oikos-api
          cache-to: type=gha,mode=max,scope=oikos-api
      - uses: docker/build-push-action@v6
        with:
          context: ./oikos-web
          push: true
          build-args: |
            VITE_API_URL=https://oikos-staging.tech/api/v1
          tags: |
            ${{ env.WEB_IMAGE }}:recette
            ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=oikos-web
          cache-to: type=gha,mode=max,scope=oikos-web

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          # Fail with an attributable message instead of a bare "exit code 1":
          # GitHub masks every log occurrence of a secret's value, and
          # ssh-keyscan's own stderr normally echoes the host back - so a
          # masked failure here previously left nothing to debug from. None
          # of the messages below embed $VPS_HOST/$VPS_SSH_KEY, so they
          # can't be swallowed by masking themselves.
          if [ -z "$VPS_HOST" ]; then
            echo "::error::VPS_HOST secret is empty or unset"
            exit 1
          fi
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY secret is empty or unset"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "::error::ssh-keyscan failed - VPS_HOST is likely wrong, or the VPS is unreachable/down/firewalled on port 22"
            sed "s/$VPS_HOST/<VPS_HOST>/g" /tmp/keyscan.err
            exit 1
          fi
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan produced no host key - VPS_HOST is likely wrong, or the VPS is unreachable"
            exit 1
          fi
      - name: Sync compose files to VPS
        run: |
          scp -i ~/.ssh/id_deploy docker-compose.yml docker-compose.staging.yml Caddyfile \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/oikos/
          # The migration directory on the VPS is a MIRROR of this one, not an accumulation:
          # emptied before every copy so that a migration deleted or renamed here disappears
          # there too. scp only ever adds, so without this the VPS keeps running files the
          # repository no longer contains - which is how the 2026-08-17 squash failed its first
          # deployment: Flyway found the new V1 alongside the stale V2..V15 left by earlier
          # deploys, and replayed ALTERs against a schema that already had them applied.
          ssh -i ~/.ssh/id_deploy ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /opt/oikos/oikos-api/src/main/resources/db/migration \
             && rm -f /opt/oikos/oikos-api/src/main/resources/db/migration/*.sql"
          scp -i ~/.ssh/id_deploy oikos-api/src/main/resources/db/migration/*.sql \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/oikos/oikos-api/src/main/resources/db/migration/
      - name: Pull & restart services on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/oikos
            export IMAGE_TAG=sha-${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
            # flyway est un service one-shot : "up -d" seul ne le relance pas
            # une fois qu'il a déjà tourné (image/mount inchangés d'un point
            # de vue compose), donc les migrations d'un nouveau déploiement
            # ne s'appliqueraient jamais sans ce --force-recreate ciblé.
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --force-recreate flyway
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
            docker image prune -f
