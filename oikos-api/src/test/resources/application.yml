spring:
  datasource:
    url: jdbc:h2:mem:oikos-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    username:
    password:

oikos:
  security:
    jwt:
      secret: test-secret-key-for-jwt-signing-must-be-at-least-32-bytes-long
      access-token-ttl-seconds: 900
      onboarding-token-ttl-seconds: 7200
      refresh-token-ttl-seconds: 1209600
    cors:
      allowed-origins: http://localhost:*,http://127.0.0.1:*
  property:
    configure:
      max-units: 500
  mail:
    from: no-reply@oikos.ma
    # Mêmes placeholders que application.yml, délibérément : figer les URL en dur
    # ici rendrait la dérivation depuis APP_PUBLIC_BASE_URL intestable, et c'est
    # précisément la mécanique qui a laissé passer un lien vers localhost en
    # recette (voir PublicBaseUrlConfigurationTest).
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
    verification-base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:8080/api/v1/users/verify}
    verification-token-ttl-hours: 24
    account-activation-base-url: ${APP_ACCOUNT_ACTIVATION_BASE_URL:${oikos.mail.public-base-url}/activate-account}
    password-reset-base-url: ${APP_PASSWORD_RESET_BASE_URL:${oikos.mail.public-base-url}/reset-password}
    password-reset-token-ttl-hours: 1
    party-invitation-base-url: ${APP_PARTY_INVITATION_BASE_URL:${oikos.mail.public-base-url}/accept-invitation}
    party-invitation-token-ttl-hours: 168
    invitation-base-url: ${APP_INVITATION_BASE_URL:${oikos.mail.public-base-url}/invitations}
    invitation-token-ttl-days: 30
    convocation-confirmation-base-url: ${APP_CONVOCATION_CONFIRMATION_BASE_URL:${oikos.mail.public-base-url}/convocations/confirmation}
  storage:
    type: local
    local:
      base-dir: ./target/test-data/documents
  document:
    max-file-size-bytes: 10485760
    allowed-content-types: application/pdf,image/png,image/jpeg,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  avatar:
    max-file-size-bytes: 5242880
    allowed-content-types: image/png,image/jpeg,image/webp

logging:
  level:
    com.architek.oikos: DEBUG
