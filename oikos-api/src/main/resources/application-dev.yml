spring:
  datasource:
    url: jdbc:h2:mem:oikos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      # The catalog seeds live in db/seed/ rather than db/migration/ since the
      # 2026-08-17 squash: there is exactly one Flyway migration now, and it is
      # V1__baseline.sql, which this profile cannot run (H2, Flyway disabled,
      # schema generated by Hibernate). V1 carries the same rows for a real
      # deployment; these files carry them for dev, and the seed tests fail the
      # build if the two ever drift apart. Ordered first - dev.sql assigns roles
      # to accounts and reads better after the roles' permissions exist.
      # Every seed file must be listed here: one that ships in V1 but not in this
      # list is a 403 in dev only - the exact incident RolePermissionSeedTest was
      # written after.
      data-locations: classpath:db/seed/seed_role_permission.sql,classpath:db/seed/seed_meeting_permission.sql,classpath:db/seed/seed_convocation_channel.sql,classpath:db/seed/seed_reply_medium.sql,classpath:db/dev/dev.sql
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

oikos:
  mail:
    enabled: false
  storage:
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./target/dev-data/documents}

logging:
  level:
    com.architek.oikos: DEBUG
