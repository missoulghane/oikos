spring:
  datasource:
    url: jdbc:h2:mem:oikos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      # The RBAC bundles come from the Flyway migration itself, even though
      # Flyway is disabled here: it is the single source (see its header), and
      # loading it as a plain script is what keeps the dev profile from needing
      # its own drifting copy. Ordered first - dev.sql assigns roles to accounts
      # and reads better after the roles' permissions exist.
      data-locations: classpath:db/migration/V2__seed_role_permission.sql,classpath:db/dev/dev.sql
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

oikos:
  mail:
    enabled: false
  storage:
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./target/dev-data/documents}

logging:
  level:
    com.architek.oikos: DEBUG
