<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{email/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Réinitialisation de votre mot de passe</title>
</head>
<body>
<section>
    <p style="margin:0 0 16px;">Vous avez demandé la réinitialisation de votre mot de passe <span th:text="${brandName}">Daba Syndic</span>.</p>
    <p style="margin:0 0 16px;">Cliquez sur le bouton ci-dessous pour choisir un nouveau mot de passe.</p>
    <table th:replace="~{email/components :: button(${link}, 'Réinitialiser mon mot de passe')}"></table>
    <p th:replace="~{email/components :: fallback-link(${link})}"></p>
    <p style="margin:0;font-size:13px;color:#667085;">Ce lien expire dans 1 heure. Si vous n'êtes pas à l'origine de cette demande, ignorez cet email : votre mot de passe reste inchangé.</p>
</section>
</body>
</html>
