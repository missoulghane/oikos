server:
  shutdown: graceful

spring:
  application:
    name: oikos-api
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  jpa:
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

oikos:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 1209600
      # Volunteer-syndic wizard: covers steps 3 to 7 in one sitting. Past that the
      # visitor verifies their email and finishes as an ordinary board admin.
      onboarding-token-ttl-seconds: 7200
    # Anti-abus des endpoints publics : ils sont ouverts à tout l'internet, et
    # chacun d'eux devine un identifiant, envoie un email ou écrit en base sur
    # commande de l'appelant. Compteurs en mémoire, donc par instance : deux
    # conteneurs API derrière le proxy accorderaient chacun le plafond complet
    # (voir RateLimiter). Le déploiement n'en fait tourner qu'un.
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      # Une seule fenêtre pour tous les plafonds ci-dessous.
      window: 5m
      # Tentatives de mot de passe. Assez large pour un cabinet entier derrière
      # une seule IP publique, assez étroit pour qu'une attaque par dictionnaire
      # n'ait aucun intérêt.
      login-per-ip: 30
      # Endpoints qui font partir un email (mot de passe oublié, renvoi de
      # vérification) : ce qui est plafonné ici, c'est le coût d'envoi.
      email-send-per-ip: 10
      # Endpoints qui consomment un jeton reçu par email : autant de devinettes.
      token-attempt-per-ip: 20
      # Inscriptions et prospects du wizard : des lignes en base créées sans
      # qu'aucun compte n'existe encore.
      registration-per-ip: 10
      # Le seul plafond qui protège quelqu'un d'autre que le serveur : trois
      # emails par adresse et par fenêtre, quelle que soit l'IP qui les demande.
      # Inonder une boîte demande alors autant de patience que de machines.
      email-send-per-address: 3
    cors:
      # Dev default covers the Vite/Expo/native dev servers on any local port.
      # Recette/prod must override with the real public origin(s) of oikos-web
      # (comma-separated), e.g. https://oikos-staging.tech - see SecurityConfiguration.
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  property:
    configure:
      max-units: 500
  installment:
    # Imputation quotidienne des avances sur les échéances arrivées à terme
    # (RegularizeDueInstallmentsService) : c'est ce qui solde une échéance dont
    # le lot a déjà payé, le jour où elle échoit, sans action du syndic.
    # Heure UTC, comme l'horloge de l'application (ClockConfiguration) : la date
    # balayée est lue dans le même fuseau, les deux ne peuvent pas se contredire
    # autour de minuit. Une expression pointant une heure jamais atteinte
    # suffit à neutraliser le balayage sans release.
    regularization-cron: ${INSTALLMENT_REGULARIZATION_CRON:0 15 1 * * *}
  mail:
    # Set to false to skip real SMTP sending and log the email content instead
    # (see SmtpEmailAdapter / LoggingEmailAdapter). Overridden to false in dev.
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@daba-syndic.com}
    # ORIGINE PUBLIQUE D'oikos-web pour cet environnement. C'est LA variable à
    # définir hors du poste de développement : toutes les URL ci-dessous en
    # dérivent, et chaque lien envoyé à un copropriétaire (email, PDF de
    # convocation, QR code) est construit à partir d'elle.
    #
    # Elle existe parce que l'oubli est silencieux. Ces six URL étaient six
    # variables indépendantes retombant chacune sur localhost : en oublier une
    # ne casse rien au démarrage, ne casse rien aux tests, et se voit seulement
    # quand un destinataire reçoit un lien vers sa propre machine. C'est
    # exactement ce qui est arrivé au lien de confirmation en recette. Une seule
    # variable à poser, et un nouveau type de lien hérite d'office.
    #
    # Les surcharges individuelles restent possibles (un lien hébergé ailleurs),
    # elles sont simplement devenues l'exception plutôt que le passage obligé.
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
    verification-base-url: ${APP_VERIFICATION_BASE_URL:${oikos.mail.public-base-url}/verify-email}
    verification-token-ttl-hours: 24
    account-activation-base-url: ${APP_ACCOUNT_ACTIVATION_BASE_URL:${oikos.mail.public-base-url}/activate-account}
    password-reset-base-url: ${APP_PASSWORD_RESET_BASE_URL:${oikos.mail.public-base-url}/reset-password}
    password-reset-token-ttl-hours: 1
    party-invitation-base-url: ${APP_PARTY_INVITATION_BASE_URL:${oikos.mail.public-base-url}/accept-invitation}
    party-invitation-token-ttl-hours: 168
    invitation-base-url: ${APP_INVITATION_BASE_URL:${oikos.mail.public-base-url}/invitations}
    invitation-token-ttl-days: 30
    # Lien de confirmation de présence joint à chaque convocation, en clair, en
    # QR code et via le code court. Pas de TTL : il cesse d'accepter une réponse
    # à l'ouverture de la séance, ce que le statut de l'AG dit déjà (ADR 0002 §10).
    convocation-confirmation-base-url: ${APP_CONVOCATION_CONFIRMATION_BASE_URL:${oikos.mail.public-base-url}/convocations/confirmation}
  invitation:
    # Qui, au bureau, est prévenu d'une demande d'adhésion et de son issue.
    # Vide (le défaut) = tous les rôles du conseil ayant un siège ACTIVE : une
    # demande qui n'atteindrait qu'un destinataire attendrait son retour de
    # vacances. Une copropriété qui préfère réserver ces alertes se donne la
    # liste des rôles, séparés par des virgules, parmi PRESIDENT, TREASURER,
    # SECRETARY, MEMBER, VOLUNTEER_MANAGER, PROPERTY_MANAGER (voir BoardRole) -
    # un nom inconnu empêche le démarrage plutôt que de vider la liste en
    # silence.
    notified-board-roles: ${INVITATION_NOTIFIED_BOARD_ROLES:}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      base-dir: ${STORAGE_LOCAL_BASE_DIR:./data/documents}
  document:
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:10485760}
    allowed-content-types: ${DOCUMENT_ALLOWED_CONTENT_TYPES:application/pdf,image/png,image/jpeg,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}
  avatar:
    max-file-size-bytes: ${AVATAR_MAX_FILE_SIZE_BYTES:5242880}
    allowed-content-types: ${AVATAR_ALLOWED_CONTENT_TYPES:image/png,image/jpeg,image/webp}
  whatsapp:
    # Envoi WhatsApp via l'API Messages de Vonage (voir VonageWhatsAppAdapter).
    # Défaut OFF comme oikos.push, et pour la même raison : aucun compte WhatsApp
    # Business n'est rattaché pour l'instant, donc l'adaptateur réel se demande
    # explicitement. À true, les trois valeurs ci-dessous deviennent obligatoires
    # et l'application refuse de démarrer sans elles (silence coûteux sinon).
    enabled: ${WHATSAPP_ENABLED:false}
    # Clé/secret du compte Vonage : authentification Basic, la seconde option
    # admise par l'API Messages à côté du JWT.
    api-key: ${VONAGE_API_KEY:}
    api-secret: ${VONAGE_API_SECRET:}
    # Numéro de l'expéditeur WhatsApp (WABA), format international sans '+'.
    from: ${WHATSAPP_FROM:}
    # Région de l'API Vonage : api (par défaut), api-eu, api-us, api-ap.
    messages-url: ${VONAGE_MESSAGES_URL:https://api.nexmo.com/v1/messages}
  push:
    # Unlike oikos.mail (defaults on, a working SMTP setup is assumed in
    # production), this defaults OFF: no EAS/Expo project with push
    # credentials is configured yet (see PLAN.md Phase 3 risks). Set to true
    # once one exists, to switch from LoggingPushAdapter to ExpoPushAdapter.
    enabled: ${PUSH_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    # SMTP connectivity is not a signal the container orchestrator should
    # act on: a slow/unavailable Gmail endpoint must not flip the overall
    # /actuator/health to DOWN and take the whole app out of rotation
    # (Docker healthcheck, Compose depends_on: service_healthy, k8s probes).
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
