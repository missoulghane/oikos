# Derrière Caddy (voir Caddyfile), l'adresse vue par l'application est celle du
# proxy : sans cette bascule, tous les visiteurs partageraient un seul compteur
# anti-abus, et le premier à atteindre un plafond bloquerait tout le monde.
# `framework` fait réécrire l'adresse d'appel depuis X-Forwarded-For, que
# reverse_proxy pose lui-même.
#
# Ce réglage n'est PAS dans application.yml, et c'est délibéré : croire cet
# en-tête n'est sûr que si le proxy est le seul chemin d'entrée. C'est le cas
# ici (docker-compose.staging.yml ne publie aucun port pour l'API), ce ne l'est
# pas pour une API lancée à même un poste.
server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  # Schema migration is applied by the standalone "flyway" service in
  # docker-compose.yml before this app even starts (see its comment for
  # why: Spring's own Flyway-before-JPA auto-ordering does not reliably
  # trigger for this Spring Boot 4 / packaged-jar combination). Hibernate
  # only validates here (ddl-auto: validate above), it never migrates.
  flyway:
    enabled: false
  # No sql.init here: everything the application needs - schema and reference
  # data - comes from V1__baseline.sql through that Flyway service. A deployed
  # environment carries no test data; its users register themselves.
  sql:
    init:
      mode: never

oikos:
  mail:
    enabled: true

logging:
  level:
    com.architek.oikos: INFO
